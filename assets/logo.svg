<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" fill="none" role="img" aria-label="CX Systems">
  <defs>
    <linearGradient id="cxRibbon" x1="8" y1="12" x2="86" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A6B72"/>
      <stop offset="0.45" stop-color="#00C2CE"/>
      <stop offset="1" stop-color="#7AEEF5"/>
    </linearGradient>
    <linearGradient id="cxX" x1="48" y1="18" x2="88" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8F7F8"/>
      <stop offset="1" stop-color="#A8D4D8"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(4 8)">
    <!-- C ribbon -->
    <path d="M62 12C42 8 22 18 16 38c-6 20 4 42 26 50 10 4 22 3 30-2"
          stroke="url(#cxRibbon)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- X bars -->
