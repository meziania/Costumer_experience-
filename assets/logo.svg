    <path d="M78 22L48 70" stroke="url(#cxX)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="118" y="48" fill="#F4FBFC" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">CX Systems</text>
  <text x="120" y="74" fill="#00C2CE" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2">ENGINEERING DIGITAL SYSTEMS</text>
</svg>
