<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CX Systems — Admin</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body class="admin-page">
  <div class="noise" aria-hidden="true"></div>

  <header class="header is-scrolled">
    <div class="header-inner">
      <a class="logo" href="/" aria-label="CX Systems — Accueil">
        <img src="/assets/logo-mark.svg" alt="" class="logo-mark" width="40" height="40" />
        <span class="logo-text">
          <strong>CX Systems</strong>
          <em>Engineering Digital Systems</em>
        </span>
      </a>
      <nav class="nav" id="admin-nav">
        <button type="button" class="nav-tab is-active" data-tab="clients" hidden>Clients</button>
        <button type="button" class="nav-tab" data-tab="projects" hidden>Projets</button>
        <button type="button" class="nav-tab" data-tab="offers" hidden>Offres</button>
        <a href="/">Retour au site</a>
        <button type="button" class="nav-tab" id="logout" hidden>Déconnexion</button>
      </nav>
    </div>
  </header>

  <div id="login-view" class="admin-login">
    <div class="shell admin-login-inner">
      <div>
        <p class="kicker kicker--light">Espace privé</p>
        <h1>Gestion privée &amp; site.</h1>
        <p class="admin-login-lede">Les clients restent ici. Seuls les projets et offres publiés apparaissent sur le site.</p>
      </div>
      <form class="form" id="login-form">
        <label>
          <span>Mot de passe</span>
          <input type="password" id="login-pass" name="password" required autocomplete="current-password" placeholder="••••••••" />
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn--solid btn--light" id="login-btn">Entrer</button>
        </div>
        <p class="form-status is-error" id="login-err" hidden>Mot de passe incorrect</p>
      </form>
    </div>
  </div>

  <div id="app-view" class="admin-app" hidden>
    <section class="work">
      <div class="shell">
        <section id="tab-clients">
          <div class="section-intro section-intro--row">
            <div>
              <p class="kicker">Privé</p>
              <h2>Clients &amp; avancement</h2>
            </div>
            <button type="button" class="btn btn--solid admin-dark-btn" id="new-client">+ Nouveau client</button>
          </div>
          <div class="cases" id="client-list"></div>
        </section>

        <section id="tab-projects" hidden>
          <div class="section-intro section-intro--row">
            <div>
              <p class="kicker">Projets</p>
              <h2>Réalisations affichées</h2>
            </div>
            <button type="button" class="btn btn--solid admin-dark-btn" id="new-project">+ Nouveau projet</button>
          </div>
          <div class="cases" id="project-list"></div>
        </section>

        <section id="tab-offers" hidden>
          <div class="section-intro section-intro--row">
            <div>
              <p class="kicker">Offres</p>
              <h2>Notre offre sur le site</h2>
            </div>
            <button type="button" class="btn btn--solid admin-dark-btn" id="new-offer">+ Nouvelle offre</button>
          </div>
          <div class="cases" id="offer-list"></div>
        </section>
      </div>
    </section>
  </div>

  <dialog id="editor" class="editor">
    <form id="editor-form" class="form editor-form"></form>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
